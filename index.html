<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼓山運動中心 - 健身房人流分析</title>
    
    <!-- PWA 支援設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0c14">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- 引入競技戰術字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- 引入 Chart.js 圖表套件與 Annotation 背景標註套件 -->

    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    
    <!-- Google Analytics (GA4) 追蹤代碼 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BDLCXW3CWQ"></script>
    <script>

      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-BDLCXW3CWQ');

    <style>
        :root {
            --bg-base: #08090f;
            --card-bg: rgba(16, 20, 31, 0.85);
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-orange: #ff9100;
            --neon-green: #00ff66;
            --neon-yellow: #ffe600;
        }

        * { box-sizing: border-box; }
        body { 
            font-family: 'Rajdhani', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-base); 
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.08) 0%, transparent 45%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
            color: #e2e8f0;
            margin: 0; 
            padding: clamp(10px, 3vw, 24px); 
            overscroll-behavior-y: contain; 
        }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: clamp(16px, 3.5vw, 32px); 
            border-radius: 16px; 
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.08), 0 20px 40px rgba(0, 0, 0, 0.8); 
            position: relative;
            transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        /* 💡 頂部熱血橫幅設計 (Hero Banner) */
        .hero-banner-wrapper {
            position: relative;
            width: 100%;
            height: clamp(180px, 32vw, 320px);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }
        .hero-banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 30%;
            display: block;
            filter: contrast(1.1) brightness(0.92);
        }
        /* 賽博漸層遮罩：讓圖片自然融入下方的暗黑面板 */
        .hero-banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(8, 9, 15, 0.15) 0%, rgba(8, 9, 15, 0.4) 60%, rgba(16, 20, 31, 0.98) 100%),
                        linear-gradient(90deg, rgba(0, 240, 255, 0.15) 0%, transparent 40%, rgba(255, 0, 127, 0.15) 100%);
            pointer-events: none;
        }

        /* 懸浮背景音樂控制鈕 */
        #music-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 99999;
            background: rgba(13, 17, 27, 0.85);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 800;
            font-family: 'Noto Sans TC', sans-serif;
            letter-spacing: 0.5px;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.35), inset 0 0 10px rgba(0, 240, 255, 0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
        }
        #music-btn:hover {
            box-shadow: 0 0 24px rgba(0, 240, 255, 0.65), inset 0 0 14px rgba(0, 240, 255, 0.3);
            transform: scale(1.03);
        }
        #music-btn:active {
            transform: scale(0.96);
        }

        /* 隱藏 YouTube 播放器容器 */
        #yt-audio-player {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* 下拉提示 */
        #ptr-indicator {
            position: absolute;
            top: -46px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--neon-cyan);
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        #ptr-indicator .ptr-box {
            background: rgba(16, 22, 35, 0.95);
            padding: 6px 18px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--neon-cyan);
        }
        #ptr-spinner {
            display: inline-block;
            transition: transform 0.15s linear;
        }
        
        /* 實時狀態大字報設計 */
        .live-status { 
            text-align: center; 
            padding: clamp(24px, 5vw, 42px) 15px; 
            background: linear-gradient(180deg, rgba(20, 27, 43, 0.7) 0%, rgba(11, 14, 22, 0.9) 100%); 
            border-radius: 14px; 
            margin-bottom: 24px; 
            box-shadow: inset 0 0 25px rgba(0, 240, 255, 0.05), 0 8px 25px rgba(0, 0, 0, 0.5); 
            border-top: 4px solid var(--neon-cyan);
            border-left: 1px solid rgba(0, 240, 255, 0.2);
            border-right: 1px solid rgba(0, 240, 255, 0.2);
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            position: relative;
        }
        .live-title-main { 
            font-size: clamp(2.4rem, 6.8vw, 3.8rem); 
            color: #ffffff; 
            margin: 0 0 6px 0; 
            font-weight: 900; 
            line-height: 1.2;
            letter-spacing: 2px;
            text-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
        }
        .live-title-sub { 
            font-size: clamp(1.8rem, 5.2vw, 2.9rem); 
            color: var(--neon-cyan); 
            margin: 0 0 14px 0; 
            font-weight: 800; 
            line-height: 1.2;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
        }
        .live-subtitle { 
            font-size: clamp(1.2rem, 3.8vw, 1.8rem); 
            color: #94a3b8; 
            font-weight: 800; 
            letter-spacing: 1px;
            margin-bottom: 10px; 
        }

        /* 異常數值標籤 */
        .anomaly-badge {
            display: inline-block;
            background: rgba(255, 145, 0, 0.12);
            color: var(--neon-orange);
            border: 1px solid var(--neon-orange);
            padding: 4px 16px;
            border-radius: 4px;
            font-size: clamp(0.85rem, 2.4vw, 1.05rem);
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px rgba(255, 145, 0, 0.35);
            text-shadow: 0 0 8px rgba(255, 145, 0, 0.5);
        }

        .live-numbers { 
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(4.2rem, 14vw, 6.8rem); 
            font-weight: 900; 
            color: #ffffff; 
            margin: 0; 
            line-height: 1.05; 
            font-style: italic;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        .live-percentage { 
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(2rem, 6.5vw, 3.2rem); 
            color: #64748b; 
            font-weight: 800; 
            font-style: normal;
        }

        /* 霓虹色彩級距 */
        .text-level-green { 
            color: var(--neon-green) !important; 
            text-shadow: 0 0 22px rgba(0, 255, 102, 0.75) !important;
        }
        .text-level-yellow { 
            color: var(--neon-yellow) !important; 
            text-shadow: 0 0 22px rgba(255, 230, 0, 0.75) !important;
        }
        .text-level-red { 
            color: var(--neon-pink) !important; 
            text-shadow: 0 0 25px rgba(255, 0, 127, 0.85) !important;
        }
        .text-danger { 
            color: #ff0055 !important; 
            text-shadow: 0 0 30px rgba(255, 0, 85, 0.95) !important;
            animation: danger-pulse 1.2s infinite alternate ease-in-out;
        }
        @keyframes danger-pulse {
            from { opacity: 0.85; transform: scale(1); }
            to { opacity: 1; transform: scale(1.02); }
        }

        /* 預測卡片 */
        .prediction-box { 
            display: flex; 
            gap: 16px; 
            margin-bottom: 35px; 
        }
        .prediction-item { 
            flex: 1; 
            text-align: center; 
            padding: clamp(18px, 4vw, 26px) 12px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(18, 24, 38, 0.6);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .pred-time-label { 
            font-size: clamp(1.15rem, 3.4vw, 1.55rem); 
            color: #94a3b8; 
            font-weight: 800; 
            line-height: 1.2;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .pred-time-clock {
            font-family: 'Orbitron', monospace;
            font-size: clamp(1.3rem, 3.8vw, 1.75rem);
            color: var(--neon-cyan);
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        .pred-count { 
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.6rem, 4.5vw, 2.3rem); 
            font-weight: 800; 
            line-height: 1.2;
            margin-bottom: 6px;
        }
        .pred-level {
            font-size: clamp(1.8rem, 5.2vw, 2.6rem);
            font-weight: 900;
            line-height: 1.2;
            letter-spacing: 1px;
        }
        .pred-factors { 
            font-size: clamp(0.9rem, 2.4vw, 1.15rem); 
            color: var(--neon-cyan); 
            margin-top: 8px; 
            font-weight: bold; 
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        /* 賽博微光底框狀態樣式 */
        .card-green {
            background: linear-gradient(180deg, rgba(0, 255, 102, 0.08) 0%, rgba(13, 20, 22, 0.8) 100%) !important;
            border-color: rgba(0, 255, 102, 0.4) !important;
            color: var(--neon-green) !important;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.12);
        }
        .card-green .pred-level, .card-green .pred-count {
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
        }

        .card-yellow {
            background: linear-gradient(180deg, rgba(255, 230, 0, 0.08) 0%, rgba(24, 22, 13, 0.8) 100%) !important;
            border-color: rgba(255, 230, 0, 0.4) !important;
            color: var(--neon-yellow) !important;
            box-shadow: 0 0 20px rgba(255, 230, 0, 0.12);
        }
        .card-yellow .pred-level, .card-yellow .pred-count {
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.6);
        }

        .card-red {
            background: linear-gradient(180deg, rgba(255, 0, 127, 0.12) 0%, rgba(28, 14, 24, 0.85) 100%) !important;
            border-color: rgba(255, 0, 127, 0.5) !important;
            color: var(--neon-pink) !important;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.2);
        }
        .card-red .pred-level, .card-red .pred-count {
            text-shadow: 0 0 18px rgba(255, 0, 127, 0.8);
        }

        .card-default {
            background: rgba(18, 22, 34, 0.6);
            border-color: rgba(255, 255, 255, 0.12);
            color: #94a3b8;
        }

        h2 { 
            text-align: center; 
            color: #ffffff; 
            border-bottom: 1px solid rgba(0, 240, 255, 0.2); 
            padding-bottom: 12px; 
            margin-top: 45px; 
            font-size: clamp(1.4rem, 3.8vw, 2.0rem); 
            font-weight: 800; 
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
        }
        .chart-container { 
            position: relative; 
            height: 50vh; 
            width: 100%; 
            margin-bottom: 45px; 
            background: rgba(13, 16, 25, 0.5);
            border-radius: 12px;
            padding: 12px 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .scrollable-chart-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 45px;
            background: rgba(13, 16, 25, 0.5);
            border-radius: 12px;
            padding: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .scrollable-chart-inner {
            position: relative;
            height: 50vh;
            min-width: 1250px; 
        }
    </style>
</head>
<body>

<!-- 浮動背景音樂控制鈕 -->
<button id="music-btn" onclick="toggleMusic()">⚡ 播放音樂</button>
<div id="yt-audio-player"></div>

<div class="container" id="mainContainer">
    <!-- 下拉重新整理提示條 -->
    <div id="ptr-indicator">
        <div class="ptr-box">
            <span id="ptr-spinner">🔄</span>
            <span id="ptr-text">下拉更新</span>
        </div>
    </div>

    <!-- 💡 頂部熱血重訓視覺大圖 (Hero Banner) -->
    <div class="hero-banner-wrapper">
        <img src="banner.jpg" alt="鼓山運動中心健身房熱血訓練" class="hero-banner-img">
        <div class="hero-banner-overlay"></div>
    </div>

    <!-- 實時狀態大字報 -->
    <div class="live-status">
        <div class="live-title-main">鼓山運動中心</div>
        <div class="live-title-sub">健身房人流分析</div>
        <div class="live-subtitle">現在人數 / 容留人數</div>
        <!-- 標註異常提示容器 -->
        <div id="anomalyBadge" class="anomaly-badge" style="display: none;"></div>
        <div class="live-numbers">
            <span id="currentPeople">--</span> / 70 
            <span class="live-percentage" id="currentPercent">( --% )</span>
        </div>
    </div>

    <!-- 未來一小時擁擠度預測卡片 -->
    <div class="prediction-box">
        <div class="prediction-item card-default" id="pred30Card">
            <div class="pred-time-label">預測30分鐘後</div>
            <div class="pred-time-clock">[ <span id="pred30Time">--:--</span> ]</div>
            <div class="pred-count" id="pred30Count">計算中...</div>
            <div class="pred-level" id="pred30Level"></div>
            <div id="pred30Factor" class="pred-factors"></div>
        </div>
        <div class="prediction-item card-default" id="pred60Card">
            <div class="pred-time-label">預測60分鐘後</div>
            <div class="pred-time-clock">[ <span id="pred60Time">--:--</span> ]</div>
            <div class="pred-count" id="pred60Count">計算中...</div>
            <div class="pred-level" id="pred60Level"></div>
            <div id="pred60Factor" class="pred-factors"></div>
        </div>
    </div>

    <h2>今日分時人流趨勢</h2>
    <div class="scrollable-chart-wrapper" id="todayChartWrapper">
        <div class="scrollable-chart-inner">
            <canvas id="todayChart"></canvas>
        </div>
    </div>

    <h2>近30日每週各日平均人流</h2>
    <div class="chart-container">
        <canvas id="dayChart"></canvas>
    </div>

    <h2>近30日營運時段平均人流</h2>
    <div class="chart-container">
        <canvas id="hourChart"></canvas>
    </div>
</div>

<script>
    let todayChartInstance = null;
    let dayChartInstance = null;
    let hourChartInstance = null;

    const CAPACITY = 70;

    // YouTube 隨機播放清單（包含 Sia - Unstoppable 與 Kelly Clarkson - Stronger）
    const MUSIC_PLAYLIST = [
        '3OnnDqH6Wj8',
        'jJvDnYdD8JQ',
        'Xn676-fLq7I'
    ];

    let currentTrackIndex = Math.floor(Math.random() * MUSIC_PLAYLIST.length);
    let ytPlayer = null;
    let isPlaying = false;

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('yt-audio-player', {
            height: '1',
            width: '1',
            videoId: MUSIC_PLAYLIST[currentTrackIndex],
            playerVars: {
                'playsinline': 1
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        event.target.playVideo();
        const unlockAudio = () => {
            if (ytPlayer && !isPlaying) {
                ytPlayer.playVideo();
                isPlaying = true;
                document.getElementById('music-btn').innerText = '⏸ 暫停音樂';
            }
            window.removeEventListener('click', unlockAudio);
            window.removeEventListener('touchstart', unlockAudio);
        };
        window.addEventListener('click', unlockAudio);
        window.addEventListener('touchstart', unlockAudio);
    }

    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED) {
            playRandomNextTrack();
        }
    }

    function playRandomNextTrack() {
        if (!ytPlayer || MUSIC_PLAYLIST.length <= 1) {
            if (ytPlayer) ytPlayer.playVideo();
            return;
        }
        let nextIndex = currentTrackIndex;
        while (nextIndex === currentTrackIndex) {
            nextIndex = Math.floor(Math.random() * MUSIC_PLAYLIST.length);
        }
        currentTrackIndex = nextIndex;
        ytPlayer.loadVideoById(MUSIC_PLAYLIST[currentTrackIndex]);
        isPlaying = true;
        document.getElementById('music-btn').innerText = '⏸ 暫停音樂';
    }

    function toggleMusic() {
        if (!ytPlayer) return;
        const btn = document.getElementById('music-btn');
        if (isPlaying) {
            ytPlayer.pauseVideo();
            btn.innerText = '⚡ 播放音樂';
            isPlaying = false;
        } else {
            ytPlayer.playVideo();
            btn.innerText = '⏸ 暫停音樂';
            isPlaying = true;
        }
    }

    // 手機下拉重新整理
    let startY = 0;
    let currentY = 0;
    let isPulling = false;
    const ptrThreshold = 50;
    const ptrIndicator = document.getElementById('ptr-indicator');
    const ptrText = document.getElementById('ptr-text');
    const ptrSpinner = document.getElementById('ptr-spinner');
    const mainContainer = document.getElementById('mainContainer');

    window.addEventListener('touchstart', (e) => {
        if (window.scrollY <= 0) {
            startY = e.touches[0].pageY;
            isPulling = true;
        }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
        if (!isPulling || window.scrollY > 0) return;
        currentY = e.touches[0].pageY;
        let diff = currentY - startY;

        if (diff > 0) {
            let moveY = Math.min(diff * 0.4, 65);
            mainContainer.style.transform = `translateY(${moveY}px)`;
            
            if (moveY > 15) {
                ptrIndicator.style.opacity = '1';
            } else {
                ptrIndicator.style.opacity = '0';
            }

            let rotation = (diff / ptrThreshold) * 180;
            ptrSpinner.style.transform = `rotate(${rotation}deg)`;

            if (diff >= ptrThreshold) {
                ptrText.innerText = '放開立即更新';
            } else {
                ptrText.innerText = '下拉更新';
            }
        }
    }, { passive: true });

    window.addEventListener('touchend', () => {
        if (!isPulling) return;
        let diff = currentY - startY;
        isPulling = false;

        if (diff >= ptrThreshold && window.scrollY <= 0) {
            ptrText.innerText = '同步中...';
            ptrSpinner.style.transform = 'rotate(360deg)';
            setTimeout(() => {
                location.reload();
            }, 200);
        } else {
            ptrIndicator.style.opacity = '0';
            mainContainer.style.transform = 'translateY(0)';
        }
        startY = 0;
        currentY = 0;
    });

    Chart.defaults.font.family = "'Rajdhani', 'Noto Sans TC', sans-serif";
    Chart.defaults.color = "#94a3b8";

    const getDynamicFontSize = (base) => {
        const width = window.innerWidth;
        if (width < 480) return base;
        if (width < 768) return base + 2;
        return base + 4;
    };

    const tooltipFontConfig = {
        titleFont: { family: "'Orbitron', sans-serif", size: 16, weight: 'bold' },
        bodyFont: { family: "'Rajdhani', sans-serif", size: 16, weight: 'bold' },
        backgroundColor: 'rgba(10, 14, 23, 0.95)',
        borderColor: '#00f0ff',
        borderWidth: 1,
        padding: 12
    };

    const TAIWAN_HOLIDAYS = [
        "01-01", "02-28", "04-04", "04-05", "05-01", "06-10", "09-17", "10-10"
    ];

    function getBarColors(dataArray) {
        const validData = dataArray.filter(v => v > 0); 
        const maxVal = validData.length > 0 ? Math.max(...validData) : 0;
        const minVal = validData.length > 0 ? Math.min(...validData) : 0;

        const remainingData = validData.filter(v => v < maxVal);
        const secondMaxVal = remainingData.length > 0 ? Math.max(...remainingData) : -1;

        return dataArray.map(val => {
            if (val === maxVal && val > 0) return 'rgba(255, 0, 127, 0.85)';       // 最高峰：霓虹桃粉
            if (val === secondMaxVal && val > 0) return 'rgba(255, 145, 0, 0.88)'; // 第二高峰：電漿橘
            if (val === minVal && val > 0) return 'rgba(0, 255, 102, 0.85)';       // 最低：矩陣綠
            return 'rgba(0, 240, 255, 0.28)';                                     // 一般：微光青色
        });
    }

    function getCrowdednessStatus(people) {
        if (people <= 25) return { text: '舒適', cardClass: 'card-green', textClass: 'text-level-green' };
        if (people <= 50) return { text: '適中', cardClass: 'card-yellow', textClass: 'text-level-yellow' };
        return { text: '擁擠', cardClass: 'card-red', textClass: 'text-level-red' };
    }

    function getHalfHourKey(dateObj) {
        const h = dateObj.getHours();
        const m = dateObj.getMinutes();
        const slot = m < 30 ? '00' : '30';
        return `${String(h).padStart(2, '0')}:${slot}`;
    }

    function smoothScrollTo(element, target, duration) {
        const start = element.scrollLeft;
        const change = target - start;
        const startTime = performance.now();

        function animateScroll(currentTime) {
            const timeElapsed = currentTime - startTime;
            const progress = Math.min(timeElapsed / duration, 1);
            
            const ease = progress < 0.5 
                ? 2 * progress * progress 
                : -1 + (4 - 2 * progress) * progress;

            element.scrollLeft = start + (change * ease);

            if (timeElapsed < duration) {
                requestAnimationFrame(animateScroll);
            }
        }
        requestAnimationFrame(animateScroll);
    }

    async function fetchAndProcessData() {
        const cacheBuster = new Date().getTime();
        const response = await fetch(`gym_capacity_log.csv?t=${cacheBuster}`);
        const textData = await response.text();
        const rawRows = textData.trim().split('\n');
        const rows = rawRows[0].includes('Timestamp') ? rawRows.slice(1) : rawRows;
        
        const now = new Date();
        const todayDateString = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
        
        const oneMonthAgo = new Date();
        oneMonthAgo.setMonth(now.getMonth() - 1);

        const dailyBaselineOffset = {};
        rows.forEach(row => {
            const cols = row.split(',');
            if (cols.length === 2) {
                const timeStr = cols[0].trim();
                const people = parseInt(cols[1]);
                const dateKey = timeStr.substring(0, 10);
                if (!isNaN(people) && !dailyBaselineOffset.hasOwnProperty(dateKey)) {
                    const hour = parseInt(timeStr.substring(11, 13));
                    if (hour === 6 && people > 10) {
                        dailyBaselineOffset[dateKey] = people;
                    } else {
                        dailyBaselineOffset[dateKey] = 0;
                    }
                }
            }
        });

        let latestPeople = '--';
        let latestRecordTime = null;
        let todayHalfHourMap = {};

        let daySums = Array(7).fill(0);
        let dayCounts = Array(7).fill(0);
        let daySamples = Array.from({ length: 7 }, () => []);
        let hourSums = Array(24).fill(0);
        let hourCounts = Array(24).fill(0);

        let historyWeekdaySums = {}, historyWeekdayCounts = {};
        let historyWeekendSums = {}, historyWeekendCounts = {};

        rows.forEach(row => {
            const cols = row.split(',');
            if (cols.length === 2) {
                const timeStr = cols[0].trim();
                const recordTime = new Date(timeStr.replace(/-/g, '/'));
                let rawPeople = parseInt(cols[1]);

                if (!isNaN(rawPeople)) {
                    latestPeople = rawPeople;
                    latestRecordTime = recordTime;

                    const dateKey = timeStr.substring(0, 10);
                    const offset = dailyBaselineOffset[dateKey] || 0;
                    const cleanPeople = Math.max(0, Math.min(CAPACITY, rawPeople - offset));

                    const hour = recordTime.getHours();
                    const timeKey = getHalfHourKey(recordTime);
                    const dayOfWeek = recordTime.getDay();

                    if (timeStr.startsWith(todayDateString)) {
                        if (hour >= 6 && hour <= 22) {
                            if (!todayHalfHourMap[timeKey]) {
                                todayHalfHourMap[timeKey] = { sum: 0, count: 0 };
                            }
                            todayHalfHourMap[timeKey].sum += cleanPeople;
                            todayHalfHourMap[timeKey].count += 1;
                        }
                    }

                    if (recordTime >= oneMonthAgo) {
                        if (hour >= 6 && hour <= 22) {
                            daySums[dayOfWeek] += cleanPeople;
                            dayCounts[dayOfWeek]++;
                            daySamples[dayOfWeek].push(cleanPeople);

                            hourSums[hour] += cleanPeople;
                            hourCounts[hour]++;

                            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                            if (isWeekend) {
                                if (!historyWeekendSums[timeKey]) {
                                    historyWeekendSums[timeKey] = 0;
                                    historyWeekendCounts[timeKey] = 0;
                                }
                                historyWeekendSums[timeKey] += cleanPeople;
                                historyWeekendCounts[timeKey] += 1;
                            } else {
                                if (!historyWeekdaySums[timeKey]) {
                                    historyWeekdaySums[timeKey] = 0;
                                    historyWeekdayCounts[timeKey] = 0;
                                }
                                historyWeekdaySums[timeKey] += cleanPeople;
                                historyWeekdayCounts[timeKey] += 1;
                            }
                        }
                    }
                }
            }
        });

        const sortedKeys = Object.keys(todayHalfHourMap).sort();
        const todayLabels = sortedKeys;
        const todayData = sortedKeys.map(key => Math.round(todayHalfHourMap[key].sum / todayHalfHourMap[key].count));

        if (latestPeople !== '--') {
            const currentPeopleElem = document.getElementById('currentPeople');
            const percentElement = document.getElementById('currentPercent');
            const anomalyElem = document.getElementById('anomalyBadge');
            
            const nowHour = now.getHours();
            const isClosed = (nowHour >= 22 || nowHour < 6);

            let todayOffset = dailyBaselineOffset[todayDateString] || 0;
            let displayPeople = Math.max(0, Math.min(CAPACITY, latestPeople - todayOffset));

            if (isClosed) {
                currentPeopleElem.innerText = '0';
                percentElement.innerText = '(已打烊)';
                currentPeopleElem.className = 'text-level-green';
                
                if (latestPeople > 0) {
                    anomalyElem.innerText = `🌙 離線保護啟動：官方閘門殘留 ${latestPeople} 人未歸零`;
                    anomalyElem.style.display = 'inline-block';
                } else {
                    anomalyElem.style.display = 'none';
                }
            } else {
                currentPeopleElem.innerText = displayPeople;
                currentPeopleElem.classList.remove('text-level-green', 'text-level-yellow', 'text-level-red');
                const currentStatus = getCrowdednessStatus(displayPeople);
                currentPeopleElem.classList.add(currentStatus.textClass);

                let percent = Math.round((displayPeople / CAPACITY) * 100);
                percentElement.innerText = `(${percent}%)`;
                
                if (percent >= 100) {
                    currentPeopleElem.classList.add('text-danger');
                    percentElement.classList.add('text-danger');
                } else {
                    currentPeopleElem.classList.remove('text-danger');
                    percentElement.classList.remove('text-danger');
                }

                if (todayOffset > 0) {
                    anomalyElem.innerText = `⚠️️ 官方晨間閘門未歸零 (+${todayOffset}人)，已自動校正還原真實人數`;
                    anomalyElem.style.display = 'inline-block';
                } else if (latestPeople > CAPACITY) {
                    anomalyElem.innerText = `⚠️ 官方即時人數 (${latestPeople}人) 已超過上限 70 人，已自動封頂校正`;
                    anomalyElem.style.display = 'inline-block';
                } else {
                    anomalyElem.style.display = 'none';
                }

                calculatePrediction(latestRecordTime, displayPeople, {
                    weekdaySums: historyWeekdaySums, weekdayCounts: historyWeekdayCounts,
                    weekendSums: historyWeekendSums, weekendCounts: historyWeekendCounts
                });
            }
        }

        const dayOrder = [1, 2, 3, 4, 5, 6, 0];
        const dayLabels = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
        const dayAvgs = dayOrder.map(d => dayCounts[d] > 0 ? Math.round(daySums[d] / dayCounts[d]) : 0);
        
        const dayP95sOrdered = dayOrder.map(d => {
            const arr = daySamples[d];
            if (!arr || arr.length === 0) return 0;
            arr.sort((a, b) => a - b);
            const idx = Math.floor(arr.length * 0.95);
            return arr[Math.min(idx, arr.length - 1)];
        });

        const hourLabels = [];
        const hourAvgs = [];
        for (let i = 6; i <= 22; i++) {
            hourLabels.push(i.toString().padStart(2, '0') + ':00');
            hourAvgs.push(hourCounts[i] > 0 ? Math.round(hourSums[i] / hourCounts[i]) : 0);
        }

        return { todayLabels, todayData, dayLabels, dayAvgs, dayP95sOrdered, hourLabels, hourAvgs };
    }

    function calculatePrediction(nowTime, currentPeople, historyData) {
        if (!nowTime) return;

        const monthDayStr = String(nowTime.getMonth() + 1).padStart(2, '0') + '-' + String(nowTime.getDate()).padStart(2, '0');
        const isHoliday = TAIWAN_HOLIDAYS.includes(monthDayStr);
        const isTodayWeekend = (nowTime.getDay() === 0 || nowTime.getDay() === 6) || isHoliday;

        const activeSums = isTodayWeekend ? historyData.weekendSums : historyData.weekdaySums;
        const activeCounts = isTodayWeekend ? historyData.weekendCounts : historyData.weekdayCounts;

        const currentKey = getHalfHourKey(nowTime);
        const currentHistAvg = (activeCounts[currentKey] && activeCounts[currentKey] > 0)
            ? (activeSums[currentKey] / activeCounts[currentKey])
            : currentPeople;

        const factorText = isHoliday ? "⚡ 國定假日模式" : "";

        const time30 = new Date(nowTime.getTime() + 30 * 60000);
        const pred30People = getSmoothedPred(time30, activeSums, activeCounts, currentHistAvg, currentPeople);

        const time60 = new Date(nowTime.getTime() + 60 * 60000);
        const pred60People = getSmoothedPred(time60, activeSums, activeCounts, currentHistAvg, pred30People);

        renderPredUI(time30, 'pred30Card', 'pred30Time', 'pred30Count', 'pred30Level', 'pred30Factor', pred30People, factorText);
        renderPredUI(time60, 'pred60Card', 'pred60Time', 'pred60Count', 'pred60Level', 'pred60Factor', pred60People, factorText);
    }

    function getSmoothedPred(targetTime, activeSums, activeCounts, baseHistAvg, basePeople) {
        const hour = targetTime.getHours();
        if (hour < 6 || hour > 22) return -1;

        const key = getHalfHourKey(targetTime);
        const futureHistAvg = (activeCounts[key] && activeCounts[key] > 0)
            ? (activeSums[key] / activeCounts[key])
            : basePeople;

        const trendDelta = futureHistAvg - baseHistAvg;
        let pred = Math.round(basePeople + (trendDelta * 0.4));
        return Math.max(0, Math.min(CAPACITY, pred));
    }

    function renderPredUI(futureTime, cardElemId, timeElemId, countElemId, levelElemId, factorElemId, predPeople, factorText) {
        const hour = futureTime.getHours();
        const timeFormatted = `${String(hour).padStart(2, '0')}:${String(futureTime.getMinutes()).padStart(2, '0')}`;

        document.getElementById(timeElemId).innerText = timeFormatted;
        const cardElem = document.getElementById(cardElemId);
        const countElem = document.getElementById(countElemId);
        const levelElem = document.getElementById(levelElemId);

        if (predPeople === -1) {
            countElem.innerText = '已打烊';
            levelElem.innerText = '';
            cardElem.className = 'prediction-item card-default';
            document.getElementById(factorElemId).innerText = '';
            return;
        }

        const statusInfo = getCrowdednessStatus(predPeople);

        countElem.innerText = `約 ${predPeople} 人`;
        levelElem.innerText = statusInfo.text;
        cardElem.className = `prediction-item ${statusInfo.cardClass}`;
        document.getElementById(factorElemId).innerText = factorText;
    }

    async function renderCharts() {
        const data = await fetchAndProcessData();
        const tickFontSize = getDynamicFontSize(14);
        const titleFontSize = getDynamicFontSize(16);
        const labelFontSize = getDynamicFontSize(13);

        let maxLabel = null, maxVal = -1;
        let minLabel = null, minVal = Infinity;

        if (data.todayData.length > 0) {
            data.todayData.forEach((val, idx) => {
                if (val > maxVal) { maxVal = val; maxLabel = data.todayLabels[idx]; }
                if (val < minVal) { minVal = val; minLabel = data.todayLabels[idx]; }
            });
        }

        let annotationsConfig = {
            comfortZone: {
                type: 'box', yMin: 0, yMax: 25,
                backgroundColor: 'rgba(0, 255, 102, 0.06)', borderWidth: 0,
                label: { display: true, content: '綠色：舒適 (0-25人)', position: { x: 'start', y: 'center' }, font: { family: "'Rajdhani', sans-serif", size: labelFontSize, weight: 'bold' }, color: 'rgba(0, 255, 102, 0.85)' }
            },
            moderateZone: {
                type: 'box', yMin: 25, yMax: 50,
                backgroundColor: 'rgba(255, 230, 0, 0.05)', borderWidth: 0,
                label: { display: true, content: '黃色：適中 (25-50人)', position: { x: 'start', y: 'center' }, font: { family: "'Rajdhani', sans-serif", size: labelFontSize, weight: 'bold' }, color: 'rgba(255, 230, 0, 0.85)' }
            },
            crowdedZone: {
                type: 'box', yMin: 50, yMax: CAPACITY,
                backgroundColor: 'rgba(255, 0, 127, 0.08)', borderWidth: 0,
                label: { display: true, content: '紅色：擁擠 (50-70人)', position: { x: 'start', y: 'center' }, font: { family: "'Rajdhani', sans-serif", size: labelFontSize, weight: 'bold' }, color: 'rgba(255, 0, 127, 0.9)' }
            }
        };

        if (maxLabel !== null) {
            annotationsConfig.maxPoint = {
                type: 'point', xValue: maxLabel, yValue: maxVal,
                backgroundColor: '#ff007f', radius: 7, borderColor: '#ffffff', borderWidth: 1.5
            };
            annotationsConfig.maxLabel = {
                type: 'label', xValue: maxLabel, yValue: maxVal,
                yAdjust: -18,
                backgroundColor: 'rgba(255, 0, 127, 0.9)',
                content: `最高: ${maxVal}人`,
                color: '#fff', font: { family: "'Orbitron', sans-serif", size: labelFontSize + 1, weight: 'bold' },
                padding: 6, borderRadius: 4
            };
        }

        if (minLabel !== null && minLabel !== maxLabel) {
            annotationsConfig.minPoint = {
                type: 'point', xValue: minLabel, yValue: minVal,
                backgroundColor: '#00ff66', radius: 7, borderColor: '#ffffff', borderWidth: 1.5
            };
            annotationsConfig.minLabel = {
                type: 'label', xValue: minLabel, yValue: minVal,
                yAdjust: 16,
                backgroundColor: 'rgba(0, 255, 102, 0.9)',
                content: `最低: ${minVal}人`,
                color: '#000', font: { family: "'Orbitron', sans-serif", size: labelFontSize + 1, weight: 'bold' },
                padding: 6, borderRadius: 4
            };
        }

        if (todayChartInstance) todayChartInstance.destroy();
        const ctxToday = document.getElementById('todayChart').getContext('2d');
        todayChartInstance = new Chart(ctxToday, {
            type: 'line',
            data: {
                labels: data.todayLabels,
                datasets: [{
                    label: '今日每半小時平均人數',
                    data: data.todayData,
                    borderColor: '#00f0ff',
                    backgroundColor: 'rgba(0, 240, 255, 0.15)',
                    borderWidth: 3.5,
                    pointRadius: 5,
                    pointBackgroundColor: '#00f0ff',
                    pointBorderColor: '#ffffff',
                    pointBorderWidth: 1.5,
                    fill: false,
                    tension: 0.35,
                    yAxisID: 'y'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { left: 12, right: 12 } },
                animation: { duration: 0 },
                plugins: {
                    legend: {
                        labels: { color: '#00f0ff', font: { size: titleFontSize, weight: 'bold' } }
                    },
                    tooltip: tooltipFontConfig,
                    annotation: { annotations: annotationsConfig }
                },
                scales: { 
                    x: { 
                        ticks: { color: '#94a3b8', font: { size: tickFontSize, weight: 'bold' } }, 
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        maxRotation: 45, minRotation: 45 
                    },
                    y: { 
                        position: 'left',
                        ticks: { color: '#94a3b8', font: { size: tickFontSize, weight: 'bold' } }, 
                        grid: { color: 'rgba(255, 255, 255, 0.06)' },
                        beginAtZero: true, 
                        max: CAPACITY,
                        title: { display: true, text: '平均人數', color: '#00f0ff', font: { size: titleFontSize, weight: 'bold' } } 
                    },
                    y1: {
                        position: 'right',
                        ticks: { color: '#94a3b8', font: { size: tickFontSize, weight: 'bold' } },
                        beginAtZero: true,
                        max: CAPACITY,
                        grid: { drawOnChartArea: false },
                        title: { display: true, text: '平均人數', color: '#00f0ff', font: { size: titleFontSize, weight: 'bold' } }
                    }
                }
            }
        });

        const wrapper = document.getElementById('todayChartWrapper');
        wrapper.scrollLeft = 0;

        let hasScrolled = false;
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && !hasScrolled) {
                    hasScrolled = true;
                    setTimeout(() => {
                        const targetLeft = wrapper.scrollWidth - wrapper.clientWidth;
                        smoothScrollTo(wrapper, targetLeft, 1800);
                    }, 400);
                }
            });
        }, { threshold: 0.35 });

        observer.observe(wrapper);

        if (dayChartInstance) dayChartInstance.destroy();
        const ctxDay = document.getElementById('dayChart').getContext('2d');
        dayChartInstance = new Chart(ctxDay, {
            type: 'bar', 
            data: {
                labels: data.dayLabels,
                datasets: [
                    {
                        type: 'bar',
                        label: '平均人數',
                        data: data.dayAvgs,
                        backgroundColor: getBarColors(data.dayAvgs),
                        borderRadius: 4,
                        order: 2
                    },
                    {
                        type: 'line',
                        label: '尖峰人潮 (P95)',
                        data: data.dayP95sOrdered,
                        borderColor: '#ff007f',
                        backgroundColor: '#ff007f',
                        borderWidth: 2.5,
                        pointRadius: 6,
                        pointStyle: 'rectRot',
                        fill: false,
                        order: 1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { left: 12 } },
                animation: { duration: 0 },
                plugins: { 
                    legend: { 
                        display: true, 
                        position: 'top',
                        labels: { color: '#e2e8f0', font: { size: titleFontSize, weight: 'bold' } }
                    },
                    tooltip: tooltipFontConfig
                }, 
                scales: { 
                    x: { 
                        ticks: { color: '#94a3b8', font: { size: tickFontSize, weight: 'bold' } },
                        grid: { color: 'rgba(255, 255, 255, 0.05)' }
                    },
                    y: { 
                        ticks: { color: '#94a3b8', font: { size: tickFontSize, weight: 'bold' } }, 
                        grid: { color: 'rgba(255, 255, 255, 0.06)' },
                        beginAtZero: true, 
                        max: CAPACITY, 
                        title: { display: true, text: '人數', color: '#00f0ff', font: { size: titleFontSize, weight: 'bold' } } 
                    } 
                }
            }
        });

        if (hourChartInstance) hourChartInstance.destroy();
        const ctxHour = document.getElementById('hourChart').getContext('2d');
        hourChartInstance = new Chart(ctxHour, {
            type: 'bar',
            data: {
                labels: data.hourLabels,
                datasets: [{
                    label: '平均人數',
                    data: data.hourAvgs,
                    backgroundColor: getBarColors(data.hourAvgs),
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { left: 12 } },
                animation: { duration: 0 },
                plugins: { 
                    legend: { display: false },
                    tooltip: tooltipFontConfig
                },
                scales: { 
                    x: { 
                        ticks: { color: '#94a3b8', font: { size: tickFontSize, weight: 'bold' } }, 
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        maxRotation: 45, minRotation: 45 
                    },
                    y: { 
                        ticks: { color: '#94a3b8', font: { size: tickFontSize, weight: 'bold' } }, 
                        grid: { color: 'rgba(255, 255, 255, 0.06)' },
                        beginAtZero: true, 
                        title: { display: true, text: '平均人數', color: '#00f0ff', font: { size: titleFontSize, weight: 'bold' } } 
                    } 
                }
            }
        });

        console.log(`圖表已於 ${new Date().toLocaleTimeString()} 重新計算並更新`);
    }

    window.addEventListener('resize', () => {
        if (todayChartInstance) renderCharts();
    });

    renderCharts();

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker 註冊成功:', reg.scope))
                .catch(err => console.log('Service Worker 註冊失敗:', err));
        });
    }
