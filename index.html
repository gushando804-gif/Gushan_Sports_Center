<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼓山運動中心 - 健身房人流分析</title>
    
    <!-- PWA 支援設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0c14">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- 引入競技戰術字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- 引入 Chart.js 圖表套件與 Annotation 背景標註套件 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    
    <!-- Google Analytics (GA4) 追蹤代碼 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BDLCXW3CWQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-BDLCXW3CWQ');
    </script>

    <style>
        :root {
            --bg-base: #08090f;
            --card-bg: rgba(16, 20, 31, 0.85);
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-orange: #ff9100;
            --neon-green: #00ff66;
            --neon-yellow: #ffe600;
        }

        * { box-sizing: border-box; }
        body { 
            font-family: 'Rajdhani', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-base); 
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.08) 0%, transparent 45%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
            color: #e2e8f0;
            margin: 0; 
            padding: clamp(10px, 3vw, 24px); 
            overscroll-behavior-y: contain; 
        }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: clamp(16px, 3.5vw, 32px); 
            border-radius: 16px; 
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.08), 0 20px 40px rgba(0, 0, 0, 0.8); 
            position: relative;
            transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        /* 頂部熱血橫幅設計 (防止初次載入閃爍) */
        .hero-banner-wrapper {
            position: relative;
            width: 100%;
            height: clamp(180px, 32vw, 320px);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            background: #0d111b;
        }
        .hero-banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 30%;
            display: block;
            filter: contrast(1.05) brightness(1.02);
            opacity: 0;
            transition: opacity 0.35s ease-in-out;
        }
        .hero-banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(8, 9, 15, 0) 65%, rgba(16, 20, 31, 0.75) 100%),
                        linear-gradient(90deg, rgba(0, 240, 255, 0.08) 0%, transparent 30%, rgba(255, 0, 127, 0.08) 100%);
            pointer-events: none;
        }

        /* 懸浮背景音樂控制鈕 */
        #music-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 99999;
            background: rgba(13, 17, 27, 0.85);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 800;
            font-family: 'Noto Sans TC', sans-serif;
            letter-spacing: 0.5px;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.35), inset 0 0 10px rgba(0, 240, 255, 0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
        }
        #music-btn:hover {
            box-shadow: 0 0 24px rgba(0, 240, 255, 0.65), inset 0 0 14px rgba(0, 240, 255, 0.3);
            transform: scale(1.03);
        }
        #music-btn:active {
            transform: scale(0.96);
        }

        #yt-audio-player {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        #ptr-indicator {
            position: absolute;
            top: -46px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--neon-cyan);
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        #ptr-indicator .ptr-box {
            background: rgba(16, 22, 35, 0.95);
            padding: 6px 18px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--neon-cyan);
        }
        #ptr-spinner {
            display: inline-block;
            transition: transform 0.15s linear;
        }
        
        .live-status { 
            text-align: center; 
            padding: clamp(24px, 5vw, 42px) 15px; 
            background: linear-gradient(180deg, rgba(20, 27, 43, 0.7) 0%, rgba(11, 14, 22, 0.9) 100%); 
            border-radius: 14px; 
            margin-bottom: 24px; 
            box-shadow: inset 0 0 25px rgba(0, 240, 255, 0.05), 0 8px 25px rgba(0, 0, 0, 0.5); 
            border-top: 4px solid var(--neon-cyan);
            border-left: 1px solid rgba(0, 240, 255, 0.2);
            border-right: 1px solid rgba(0, 240, 255, 0.2);
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            position: relative;
        }
        .live-title-main { 
            font-size: clamp(2.4rem, 6.8vw, 3.8rem); 
            color: #ffffff; 
            margin: 0 0 6px 0; 
            font-weight: 900; 
            line-height: 1.2;
            letter-spacing: 2px;
            text-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
        }
        .live-title-sub { 
            font-size: clamp(1.8rem, 5.2vw, 2.9rem); 
            color: var(--neon-cyan); 
            margin: 0 0 14px 0; 
            font-weight: 800; 
            line-height: 1.2;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
        }
        .live-subtitle { 
            font-size: clamp(1.2rem, 3.8vw, 1.8rem); 
            color: #94a3b8; 
            font-weight: 800; 
            letter-spacing: 1px;
            margin-bottom: 10px; 
        }

        .anomaly-badge {
            display: inline-block;
            background: rgba(255, 145, 0, 0.12);
            color: var(--neon-orange);
            border: 1px solid var(--neon-orange);
            padding: 4px 16px;
            border-radius: 4px;
            font-size: clamp(0.85rem, 2.4vw, 1.05rem);
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px rgba(255, 145, 0, 0.35);
            text-shadow: 0 0 8px rgba(255, 145, 0, 0.5);
        }

        .live-numbers { 
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(4.2rem, 14vw, 6.8rem); 
            font-weight: 900; 
            color: #ffffff; 
            margin: 0; 
            line-height: 1.05; 
            font-style: italic;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        .live-percentage { 
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(2rem, 6.5vw, 3.2rem); 
            color: #64748b; 
            font-weight: 800; 
            font-style: normal;
        }

        .text-level-green { 
            color: var(--neon-green) !important; 
            text-shadow: 0 0 22px rgba(0, 255, 102, 0.75) !important;
        }
        .text-level-yellow { 
            color: var(--neon-yellow) !important; 
            text-shadow: 0 0 22px rgba(255, 230, 0, 0.75) !important;
        }
        .text-level-red { 
            color: var(--neon-pink) !important; 
            text-shadow: 0 0 25px rgba(255, 0, 127, 0.85) !important;
        }
        .text-danger { 
            color: #ff0055 !important; 
            text-shadow: 0 0 30px rgba(255, 0, 85, 0.95) !important;
            animation: danger-pulse 1.2s infinite alternate ease-in-out;
        }
        @keyframes danger-pulse {
            from { opacity: 0.85; transform: scale(1); }
            to { opacity: 1; transform: scale(1.02); }
        }

        .prediction-box { 
            display: flex; 
            gap: 16px; 
            margin-bottom: 35px; 
        }
        .prediction-item { 
            flex: 1; 
            text-align: center; 
            padding: clamp(18px, 4vw, 26px) 12px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(18, 24, 38, 0.6);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .pred-time-label { 
            font-size: clamp(1.15rem, 3.4vw, 1.55rem); 
            color: #94a3b8; 
            font-weight: 800; 
            line-height: 1.2;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .pred-time-clock {
            font-family: 'Orbitron', monospace;
            font-size: clamp(1.3rem, 3.8vw, 1.75rem);
            color: var(--neon-cyan);
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        .pred-count { 
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.6rem, 4.5vw, 2.3rem); 
            font-weight: 800; 
            line-height: 1.2;
            margin-bottom: 6px;
        }
        .pred-level {
            font-size: clamp(1.8rem, 5.2vw, 2.6rem);
            font-weight: 900;
            line-height: 1.2;
            letter-spacing: 1px;
        }
        .pred-factors { 
            font-size: clamp(0.9rem, 2.4vw, 1.15rem); 
            color: var(--neon-cyan); 
            margin-top: 8px; 
            font-weight: bold; 
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        .card-green {
            background: linear-gradient(180deg, rgba(0, 255, 102, 0.08) 0%, rgba(13, 20, 22, 0.8) 100%) !important;
            border-color: rgba(0, 255, 102, 0.4) !important;
            color: var(--neon-green) !important;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.12);
        }
        .card-green .pred-level, .card-green .pred-count {
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
        }

        .card-yellow {
            background: linear-gradient(180deg, rgba(255, 230, 0, 0.08) 0%, rgba(24, 22, 13, 0.8) 100%) !important;
            border-color: rgba(255, 230, 0, 0.4) !important;
            color: var(--neon-yellow) !important;
            box-shadow: 0 0 20px rgba(255, 230, 0, 0.12);
        }
        .card-yellow .pred-level, .card-yellow .pred-count {
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.6);
        }

        .card-red {
            background: linear-gradient(180deg, rgba(255, 0, 127, 0.12) 0%, rgba(28, 14, 24, 0.85) 100%) !important;
            border-color: rgba(255, 0, 127, 0.5) !important;
            color: var(--neon-pink) !important;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.2);
        }
        .card-red .pred-level, .card-red .pred-count {
            text-shadow: 0 0 18px rgba(255, 0, 127, 0.8);
        }

        .card-default {
            background: rgba(18, 22, 34, 0.6);
            border-color: rgba(255, 255, 255, 0.12);
            color: #94a3b8;
        }

        h2 { 
            text-align: center; 
            color: #ffffff; 
            border-bottom: 1px solid rgba(0, 240, 255, 0.2); 
            padding-bottom: 12px; 
            margin-top: 45px; 
            font-size: clamp(1.4rem, 3.8vw, 2.0rem); 
            font-weight: 800; 
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
        }
        .chart-container { 
            position: relative; 
            height: 50vh; 
            width: 100%; 
            margin-bottom: 45px; 
            background: rgba(13, 16, 25, 0.5);
            border-radius: 12px;
            padding: 12px 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .scrollable-chart-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 45px;
            background: rgba(13, 16, 25, 0.5);
            border-radius: 12px;
            padding: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .scrollable-chart-inner {
            position: relative;
            height: 50vh;
            min-width: 1250px; 
        }
    </style>
</head>
<body>

<!-- 浮動背景音樂控制鈕 -->
<button id="music-btn" onclick="toggleMusic()">⚡ 播放音樂</button>
<div id="yt-audio-player"></div>

<div class="container" id="mainContainer">
    <!-- 下拉重新整理提示條 -->
    <div id="ptr-indicator">
        <div class="ptr-box">
            <span id="ptr-spinner">🔄</span>
            <span id="ptr-text">下拉更新</span>
        </div>
    </div>

    <!-- 頂部人流情境大圖 (初始化為空，等判定後淡入，不再閃跳) -->
    <div class="hero-banner-wrapper">
        <img id="heroBannerImg" alt="鼓山運動中心健身房人流即時情境" class="hero-banner-img">
        <div class="hero-banner-overlay"></div>
    </div>

    <!-- 實時狀態大字報 -->
    <div class="live-status">
        <div class="live-title-main">鼓山運動中心</div>
        <div class="live-title-sub">健身房人流分析</div>
        <div class="live-subtitle">現在人數 / 容留人數</div>
        <div id="anomalyBadge" class="anomaly-badge" style="display: none;"></div>
        <div class="live-numbers">
            <span id="currentPeople">--</span> /
