<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼓山運動中心 - 人流統計圖</title>
    <!-- 引入 Chart.js 圖表套件 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .chart-container { position: relative; height: 60vh; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h2>鼓山運動中心 健身房人數趨勢</h2>
    <div class="chart-container">
        <canvas id="capacityChart"></canvas>
    </div>
</div>

<script>
    // 建立一個變數來儲存圖表，以便更新時能先清空舊圖表
    let myChart = null;

    // 自動讀取 CSV 檔案 (加入時間戳記破解瀏覽器快取)
    async function fetchData() {
        // 在網址後方加上目前時間毫秒，強迫抓取最新檔案
        const cacheBuster = new Date().getTime();
        const response = await fetch(`gym_capacity_log.csv?t=${cacheBuster}`);
        const data = await response.text();
        
        const rows = data.trim().split('\n').slice(1);
        const timeLabels = [];
        const peopleData = [];
        
        rows.forEach(row => {
            const cols = row.split(',');
            if(cols.length === 2) {
                const shortTime = cols[0].substring(5, 16); 
                timeLabels.push(shortTime);
                peopleData.push(parseInt(cols[1]));
            }
        });
        
        return { timeLabels, peopleData };
    }

    // 繪製圖表
    async function renderChart() {
        const data = await fetchData();
        const ctx = document.getElementById('capacityChart').getContext('2d');
        
        // 【關鍵】如果畫面上已經有圖表了，必須先把它銷毀，否則新舊圖表會重疊閃爍
        if (myChart !== null) {
            myChart.destroy();
        }
        
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.timeLabels,
                datasets: [{
                    label: '現場人數',
                    data: data.peopleData,
                    borderColor: 'rgba(12, 180, 181, 1)',
                    backgroundColor: 'rgba(12, 180, 181, 0.2)',
                    borderWidth: 2,
                    pointRadius: 3,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { maxRotation: 45, minRotation: 45 } },
                    y: { 
                        beginAtZero: true, 
                        suggestedMax: 70,
                        title: { display: true, text: '人數' }
                    }
                },
                // 加入動畫取消，讓自動更新時畫面不會一直彈跳
                animation: {
                    duration: 0
                }
            }
        });
        
        // 在網頁開發者工具印出更新時間，方便確認自動更新有在運作
        console.log(`圖表已於 ${new Date().toLocaleTimeString()} 自動更新`);
    }

    // 1. 網頁剛打開時，立刻執行第一次載入
    renderChart();

    // 2. 設定定時器：每 5 分鐘 (300000 毫秒) 自動重新載入一次資料
    setInterval(renderChart,10000);
</script>

</body>
</html>
