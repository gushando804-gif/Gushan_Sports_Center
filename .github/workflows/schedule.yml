name: Gym Capacity Auto Tracker

on:
  schedule:
    # 每 30 分鐘執行一次
    - cron: '*/30 * * * *' 
  workflow_dispatch: # 允許手動執行

jobs:
  run-and-record:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許寫入檔案 (非常重要)

    steps:
      - name: 取得最新程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 執行爬蟲腳本
        run: python main.py

      - name: 將更新後的 CSV 提交回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gym_capacity_log.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update capacity log"
          git push
