name: Gym Capacity Auto Tracker

on:
  schedule:
    - cron: '*/1 * * * *' 
  workflow_dispatch:

jobs:
  run-and-record:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 取得最新程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 執行爬蟲腳本
        run: python main.py

      - name: 將更新後的 CSV 提交回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -f gym_capacity_log.csv ]; then
            git add gym_capacity_log.csv
            git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update capacity log"
            git push
          else
            echo "未產生 CSV 檔案，代表本次未成功抓取資料，略過 Commit 步驟。"
          fi
